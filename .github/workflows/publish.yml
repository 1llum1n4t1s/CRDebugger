name: Publish to NuGet

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 全プロジェクトが net8.0 と net10.0 の両方をターゲットにしているため、両方の SDK を明示導入する。
          # 8.0.x だけを指定していた時期は net10.0 のビルドがランナーイメージの
          # プリインストール SDK に暗黙依存しており、イメージ更新で黙って壊れる状態だった。
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate Patch Version (Even Only)
        shell: pwsh
        run: |
          $xml = [xml](Get-Content Directory.Build.props)
          $version = $xml.Project.PropertyGroup.Version
          $parts = $version.Split('.')
          $patch = [int]$parts[2]
          if ($patch % 2 -ne 0) {
            Write-Error "Patch version must be even: $version (got $patch)"
            exit 1
          }
          if ($patch -ge 999) {
            Write-Error "Patch version too high: $version. Bump minor version instead."
            exit 1
          }
          Write-Host "Version $version is valid"

      - name: Restore dependencies
        run: dotnet restore CRDebugger.slnx

      - name: Build Release
        run: dotnet build CRDebugger.slnx -c Release --no-restore

      - name: Run Tests
        run: dotnet test tests/CRDebugger.Core.Tests --no-build -c Release --logger trx

      - name: Pack CRDebugger.WinForms
        run: dotnet pack src/CRDebugger.WinForms/CRDebugger.WinForms.csproj -c Release --no-build -o artifacts

      - name: Pack CRDebugger.Wpf
        run: dotnet pack src/CRDebugger.Wpf/CRDebugger.Wpf.csproj -c Release --no-build -o artifacts

      - name: Pack CRDebugger.Avalonia
        run: dotnet pack src/CRDebugger.Avalonia/CRDebugger.Avalonia.csproj -c Release --no-build -o artifacts

      - name: Authenticate to NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $patterns = @(
            'CRDebugger.WinForms.*.nupkg',
            'CRDebugger.Wpf.*.nupkg',
            'CRDebugger.Avalonia.*.nupkg'
          )
          $packages = foreach ($pattern in $patterns) {
            $matches = @(Get-ChildItem -Path artifacts -Filter $pattern -File)
            if ($matches.Count -ne 1) {
              Write-Error "Expected exactly one package matching '$pattern', found $($matches.Count)."
              exit 1
            }
            $matches[0]
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        shell: pwsh
