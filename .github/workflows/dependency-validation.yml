name: Dependency validation

# main への push と全 PR（Dependabot 以外も）で restore・build・回帰テストを走らせる。
# 配信タグ（vx.y.z）の公開 workflow（publish.yml）も NuGet 公開前に同じ build・test を実行する。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.run_id }}
  # 同じ PR の古い実行だけ取り消す（main push は取り消さず全件検証する）。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
      - name: Restore NuGet package cache
        id: nuget-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-dependency-validation-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages*.lock.json', '**/global.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-dependency-validation-${{ github.job }}-
            ${{ runner.os }}-nuget-
      - name: Restore
        run: |
          dotnet restore CRDebugger.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save NuGet package cache
        if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
      - name: Build
        run: |
          dotnet build CRDebugger.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing regression tests
        run: |
          dotnet test --project tests/CRDebugger.Core.Tests/CRDebugger.Core.Tests.csproj -c Release --no-build --minimum-expected-tests 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
